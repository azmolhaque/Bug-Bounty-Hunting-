# ---------------------------------------------------------------------------
# RULES OF ENGAGEMENT
# ---------------------------------------------------------------------------
rules:
  max_requests_per_second: 20    # Conservative — Marriott bans for 10k+ burp requests

  identifying_header: ""         # HackerOne programs don't require custom headers

  forbidden_techniques:
    - "fuzzing or Burp Intruder with 10,000+ requests (account ban per April 2024 policy)"
    - "denial of service / load testing / resource exhaustion"
    - "MITM attacks requiring physical hotel network access"
    - "social engineering of Marriott employees"
    - "testing real payment flows with real money"
    - "accessing other users' booking data or loyalty points"
    - "exfiltrating real customer PII beyond what proves impact"
    - "testing any asset NOT explicitly listed in in_scope"
    - "hosting evidence externally (must store only in HackerOne submission)"
    - "public disclosure without written consent from Marriott"
    - "reflected XSS (now OOS per April 2025 update)"
    - "DOM-based XSS requiring user interaction (OOS per April 2025)"
    - "open redirects without chain to ATO"
    - "leaked tokens/cookies without proof of account takeover"

  out_of_scope_bug_classes:
    - "Reflected XSS"
    - "DOM-based XSS requiring user interaction"
    - "Web Cache Poisoning"
    - "HTML injection without persistent modification"
    - "Open redirects (unless chained to ATO)"
    - "CSRF on logout or read-only actions"
    - "Missing HSTS/X-Frame-Options/CSP headers (no exploit path)"
    - "Software version disclosure (no CVE chained)"
    - "Clickjacking on non-sensitive pages"
    - "SPF/DKIM/DMARC misconfigs"
    - "CORS on endpoints returning no sensitive data"
    - "Rate limiting absent on non-sensitive endpoints"
    - "Leaked credentials from malware logs or purchased cred packs"
    - "Zero-days with official patch in last 31 business days"
    - "MITM at hotels/physical locations"

  reward_tiers:
    critical: "$8,001 – $11,000 (avg $11,000)"
    high: "$6,000 – $8,000 (avg $4,465)"
    medium: "$600 – $3,429 (avg $2,202)"
    low: "$300 – $599 (avg $442)"

  notes: >
    Always verify domain ownership via WHOIS to domain.administrator@marriott.com
    when testing non-marriott.com assets (marrtool.com, editionhotels.com, etc.).
    Test accounts: Create dedicated accounts at marriott.com/bonvoy for testing.
    For employee-facing targets (passwordchallenge, eidhelp, esupplier): probe
    login page only — do not attempt to impersonate employees.
    Marriott response time targets: 2hr first response, 5d triage, 20d bounty.

# marriott-scope.yaml — Marriott Bug Bounty Program (HackerOne)
# Program: https://hackerone.com/marriott
# Platform: HackerOne (private → public Feb 2020)
# Last scope review: 2026-06-21
#
# USAGE WITH SCOPE-CHECK:
#   SCOPE_FILE=config/marriott-scope.yaml ./scripts/scope-check.sh <host>
#
# SEVERITY / BOUNTY:
#   Critical : $8,001 – $11,000 (avg $11,000)
#   High     : $6,000 – $8,000  (avg $4,465)
#   Medium   : $600   – $3,429  (avg $2,202)
#   Low      : $300   – $599    (avg $442)
#   Total paid to date: $559,803
#
# RATE LIMIT RULE:
#   DO NOT use Burp Intruder / fuzzing with 10,000+ requests — account ban.
#   Keep concurrency conservative. Pi default: max_requests_per_second: 20
#
# SUBMISSION RULES (critical ones):
#   - Include: researcher IP, test dates, browser/tools used, app version
#   - Validate domain ownership via WHOIS to domain.administrator@marriott.com
#   - Store evidence only within the HackerOne submission (no external hosting)
#   - Marriott does NOT permit public disclosure without written consent
#   - No public disclosure discussion until resolved and expressly approved
#
# OUT-OF-SCOPE POLICY NOTES (updated April 21, 2025):
#   - Reflected XSS, DOM-based XSS requiring user interaction → OOS
#   - Stored XSS on non-sensitive endpoints → chain to impact or drop
#   - Open redirects → OOS unless chained to ATO/token theft
#   - Leaked tokens/cookies → OOS unless proof of ATO
#   - Web Cache Poisoning → OOS
#   - HTML injection → OOS
#   - MITM requiring hotel physical network → OOS
#   - CORS on endpoints returning no sensitive data → OOS
#   - Missing security headers → OOS (unless demonstrated exploit)
#   - Software version disclosure → OOS (unless chained to CVE PoC)


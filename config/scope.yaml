# scope.yaml — Google / Alphabet Vulnerability Reward Program (VRP)
# Source: github.com/google/bughunters/tree/main/domain-tiers (authoritative protobuf)
# Program: https://bughunters.google.com/about/rules
# Platform: bughunters.google.com
#
# TIER SYSTEM (from the official bughunters repo):
#   TIER0 = Highest reward (account compromise, RCE, cross-tenant impact)
#   TIER1 = High reward (sensitive user data, auth bypass)
#   TIER2 = Medium reward (limited data access)
#   TIER3 = Lower reward (limited impact)
#   TIER4 = NEVER IN SCOPE — explicitly excluded
#
# IMPORTANT NOTES:
#   - Wiz (*.wiz.io) is TIER1 and EXPLICITLY EXEMPT from the 6-month blackout.
#   - For Google core domains, subdomains INHERIT the parent tier.
#   - For ACQUISITION domains, unlisted subdomains default to TIER4 (out of scope).
#     Only explicitly listed acquisition subdomains are in scope.
#   - TIER4 domains always win (default-deny on conflict).
#   - doubleclick.net, gstatic.com, googleapis.com, googletagmanager.com,
#     googleusercontent.com are TIER4 — do NOT test them.
#
# scripts/scope-check.sh enforces this file. Leave in_scope empty = agent refuses to hunt.

program: "Google & Alphabet Vulnerability Reward Program (VRP)"
platform: "bughunters.google.com"
handle: ""   # <-- fill in your bughunters.google.com researcher handle
report_url: "https://bughunters.google.com/report/"


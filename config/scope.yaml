# ---------------------------------------------------------------------------
# RULES OF ENGAGEMENT
# ---------------------------------------------------------------------------
rules:
  max_requests_per_second: 100    # conservative Pi 5 ceiling; lower if needed

  identifying_header: ""          # Google VRP does not require a specific header

  forbidden_techniques:
    - "denial of service / load testing / service degradation"
    - "automated mass scanning of IP blocks (especially Google Cloud customer VMs)"
    - "social engineering / phishing of Google employees"
    - "physical access attempts (entering Google offices)"
    - "black hat SEO / spam"
    - "testing with real user credentials (use your own test accounts only)"
    - "testing production payment flows with real money"
    - "exfiltrating real user data beyond what proves impact"
    - "production data destruction or corruption"
    - "user enumeration without demonstrating missing rate-limiting"
    - "testing *.appspot.com / *.bc.googleusercontent.com (customer-hosted)"
    - "testing acquisition subdomains NOT listed in in_scope (default TIER4)"
    - "prompt injections, jailbreaks, AI alignment/content issues (use in-product reporting)"
    - "Linux kernel vulnerabilities without functional Android/Pixel PoC"

  allowed_payloads: >
    Benign, non-destructive, read-only proofs only. OOB DNS/HTTP interaction
    (e.g. Burp Collaborator, interactsh) for blind SSRF/injection confirmation.
    Your own Google test accounts and test data only. CVSS 3.1 PoC must use
    minimal reproduction with no real-user impact.

  test_accounts: >
    Create dedicated @gmail.com test accounts for all testing.
    For Fitbit/Nest: register test devices to your own test accounts only.
    For Cloud: use your own GCP project. Never touch other users' projects or data.

  # Reward tiers (2024-2026 confirmed rates)
  reward_tiers:
    web_alphabet_vrp:
      tier0_rce_critical: "up to $101,010 (+ 1.5x quality → $151,515)"
      high: "up to $31,337"
      medium: "varies by tier"
      low: "typically $1,000–$7,500"
    cloud_vrp:
      s0_cross_tenant_no_perms: "$7,500 minimum (Tier 1 products up to $101,010)"
      top: "$101,010 (+ 1.5x → $151,515)"
    mobile_vrp_tier1:       # Fitbit, Nest, Waze apps
      rce_critical: "up to $300,000 (+ 1.5x → $450,000)"
      sensitive_data: "up to $75,000"
    chrome_vrp:
      non_sandboxed_rce: "up to $250,000"
      miracleptr_bypass: "$250,128"
    android_devices_vrp:
      zero_click_full_chain_titan_m2: "$1,500,000 (with persistence)"
    ai_vrp:
      flagship_data_modification: "up to $20,000 (+ 1.5x → $30,000)"

  notes: >
    Multiple VRP tracks: Web/Alphabet VRP, Cloud VRP, Mobile VRP (Fitbit/Nest/Waze),
    Chrome VRP, Android/Devices VRP, AI VRP, OSS VRP.
    A finding may qualify for multiple tracks — submit to all that apply.
    Acquisition domain subdomains NOT in in_scope default to TIER4 (out of scope).
    Always verify a new acquisition's blackout status before testing.
    Wiz (*.wiz.io) is confirmed TIER1 and EXEMPT from the 6-month blackout.

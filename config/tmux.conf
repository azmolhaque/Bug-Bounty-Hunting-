# ═══════════════════════════════════════════════════════════════
# ~/.tmux.conf — Raspberry Pi 5 Bug Bounty Lab
# Deploy: cp ~/bug-bounty-hunting-/config/tmux.conf ~/.tmux.conf && tmux source ~/.tmux.conf
# ═══════════════════════════════════════════════════════════════

# ─── Core settings ──────────────────────────────────────────────
set  -g default-terminal   "screen-256color"
set  -ga terminal-overrides ",xterm-256color:Tc"
set  -g history-limit       100000
set  -g mouse               on
set  -g base-index          1
setw -g pane-base-index     1
set  -g renumber-windows    on
set  -g escape-time         10     # faster key response (no ESC lag)
set  -g focus-events        on
set  -g display-time        3000   # message display ms
set  -g status-interval     5      # refresh status bar every 5s

# ─── Prefix: Ctrl-a (easier on Pi keyboard than Ctrl-b) ─────────
unbind C-b
set -g prefix C-a
bind  C-a send-prefix

# ─── Reload config ──────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "  tmux config reloaded"

# ─── Split panes (keep current path) ────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Pane navigation (Alt+arrow, no prefix needed) ───────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Vim-style pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane resizing (prefix + HJKL) ──────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Window navigation (Shift+arrow, no prefix) ─────────────────
bind -n S-Left  previous-window
bind -n S-Right next-window

# ─── Copy mode (vi keys) ────────────────────────────────────────
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ─── Status bar ─────────────────────────────────────────────────
set -g status-position bottom
set -g status-style    "bg=#1a1a2e,fg=#e0e0e0"
set -g status-left-length  40
set -g status-right-length 120

# Left: session name + window
set -g status-left "#[bg=#4a4a8a,fg=#ffffff,bold] 🔍 #S #[bg=#1a1a2e,fg=#4a4a8a]▶ #[default]"

# Right: Pi stats — single line (tmux parser doesn't concatenate multi-line strings)
set -g status-right "#[fg=#888888]#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null | head -c20) #[fg=#444444]│ #[fg=#ff6b6b]#(vcgencmd measure_temp 2>/dev/null | tr -d 'temp=') #[fg=#444444]│ #[fg=#4ecdc4]RAM:#(free -h | awk '/Mem:/{print $3\"/\"$2}') #[fg=#444444]│ #[fg=#45b7d1]n:#(pgrep -c nuclei 2>/dev/null || echo 0) #[fg=#444444]│ #[fg=#96ceb4,bold] %H:%M #[fg=#888888]%d-%b"

# Window tab style
setw -g window-status-style         "bg=#1a1a2e,fg=#888888"
setw -g window-status-format        " #I:#W "
setw -g window-status-current-style "bg=#4a4a8a,fg=#ffffff,bold"
setw -g window-status-current-format " #I:#W● "
setw -g window-status-activity-style "fg=#ff6b6b,bold"
setw -g monitor-activity            on
setw -g visual-activity             off

# Pane borders
set -g pane-border-style        "fg=#333355"
set -g pane-active-border-style "fg=#4a4a8a"
set -g pane-border-status       top
set -g pane-border-format       " #P: #{pane_current_command} "

# Message style
set -g message-style "bg=#4a4a8a,fg=#ffffff,bold"

# ─── Hunt session layouts ────────────────────────────────────────
# bind H to create a 3-pane hunt layout for current window:
#   +─────────────+─────────────+
#   │   main      │   monitor   │
#   │  (shell)    │  (htop/oob) │
#   +─────────────+─────────────+
#   │         results / log     │
#   +───────────────────────────+
bind H \
  split-window -h -p 35 -c "#{pane_current_path}" \;\
  split-window -v -p 30 -c "#{pane_current_path}" \;\
  select-pane -t 1

# bind M to open a monitor pane running pi-resource-guard in watch mode
bind M new-window -n "monitor" \
  "watch -n 5 '~/bug-bounty-hunting-/scripts/pi-resource-guard.sh --report'"

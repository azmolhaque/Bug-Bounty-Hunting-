# 1:1 reduction of gemini-cli .github/workflows/trigger_e2e.yml
# UNPRIVILEGED pull_request context (fork PR, read-only token, NO secrets).
# Its only job: persist attacker-controlled strings into an artifact.
name: 'Trigger'

on:
  pull_request:

jobs:
  save_repo_name:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Save Repo name'
        env:
          # On a fork PR these are fully attacker-controlled.
          REPO_NAME: '${{ github.event.pull_request.head.repo.full_name }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
        run: |
          mkdir -p ./pr
          echo "${REPO_NAME}" > ./pr/repo_name
          echo "${HEAD_SHA}" > ./pr/head_sha
      - uses: 'actions/upload-artifact@v4'
        with:
          name: 'repo_name'
          path: 'pr/'

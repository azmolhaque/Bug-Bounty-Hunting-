    <script type="text/javascript">
        function onSearchSubmit() {
            var filterBy = $("#app-search-text").val();
            var category = $('input[name=app-search-category-radio]:checked', '#search-box').val();
            if (category == "private")
                url = "/apps?filter=" + filterBy;
            else
                url = "/apps/public?filter=" + filterBy;
            window.location.href = url;
        }

        function getSafeRedirectUrl(urlParameter) {
            if (!urlParameter) {
                return; // No URL provided
            }
            try {
                const url = new URL(urlParameter, window.location.origin);
                if (url.protocol !== 'http:' && url.protocol !== 'https:') {
                    return; //Blocked redirect to potentially unsafe URL
                }
                if (url.hostname !== window.location.hostname) {
                    return; //Blocked redirect to external URL
                }
                return url;
            } catch (e) {
                return; // Handle cases where urlParameter is not a valid URL at all
            }
        }

        $(window).on('load', function () {
            "use strict";

            function getURLParameter(name) {
                return decodeURIComponent((new RegExp('[?|&]' + name + '=' + '([^&;]+?)(&|#|;|$)').exec(location.search)||[,""])[1].replace(/\+/g, '%20'))||null
            }

            function showTooltip(x, y, contents) {
                $('<div id="tooltip">' + contents + '</div>').css({
                    position: 'absolute',
                    display: 'none',
                    top: y + 5,
                    left: x + 20,
                    size: '10px',
                    //				'border-top' : '3px solid #1FAE66',
                    'background-color': '#111111',
                    color: "#FFFFFF",
                    opacity: 0.85
                }).appendTo("body").fadeIn(200);
            }

            // SetCookie (used by companyAdd.aspx)
            var setCookie = getURLParameter("setCookie");
            if (setCookie !== null && setCookie.startsWith('CyoMngEnt=')) {
                var redirUrl = getURLParameter("redirUrl");
                var safeUrl = getSafeRedirectUrl(redirUrl);
                if (safeUrl) {
                    document.cookie = setCookie;
                    document.location.href = safeUrl;
                }
            }

            if (false) {
                $('.vd_top-menu-wrapper').css('background', '');
                $('.vd_content-section').css('background', '');
                $('.vd_content-wrapper').css('background', '');
                $('.gallery-item').css('background', '');
            }

            // Notification

        });
    </script>
